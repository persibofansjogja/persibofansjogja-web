<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101010">
  <title>Login Admin | Persibo Fans Jogja</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#101010;color:#f6f6f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:100%;max-width:420px}
    .card{background:#191919;border:1px solid #343434;border-radius:18px;padding:30px;box-shadow:0 18px 60px #0008}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:28px}
    .brand img{width:54px;height:54px;object-fit:contain}
    .brand strong{display:block;letter-spacing:.08em}.brand small{color:#aaa}
    h1{font-size:25px;margin:0 0 8px}
    p{color:#aaa;line-height:1.5;margin:0 0 24px}
    label{display:block;font-weight:650;font-size:14px;margin:16px 0 7px}
    input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid #454545;background:#101010;color:#fff;font:inherit;outline:none}
    input:focus{border-color:#e87524;box-shadow:0 0 0 3px #e875242b}
    button{width:100%;border:0;border-radius:9px;padding:14px;margin-top:22px;background:#e87524;color:#171717;font:inherit;font-weight:750;cursor:pointer}
    .error{background:#421e1c;color:#ffc7c2;border:1px solid #75322d;border-radius:8px;padding:11px 12px;margin:0 0 16px;font-size:14px}
    .foot{font-size:12px;text-align:center;color:#777;margin-top:18px}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="brand">
      <img src="/static/images/LogoPFJ.png" alt="Logo Persibo Fans Jogja">
      <div><strong>PERSIBO FANS JOGJA</strong><small>ADMINISTRATOR</small></div>
    </div>
    <h1>Login Admin</h1>
    <p>Masuk untuk mengakses panel administrasi Persibo Fans Jogja.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Masuk ke Panel Admin</button>
    </form>
  </section>
  <div class="foot">© Persibo Fans Jogja · Akses terbatas</div>
</main>
</body>
</html>
