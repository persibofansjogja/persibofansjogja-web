<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>{% block title %}Persibo Fans Jogja{% endblock %}</title>
  {% block head_meta %}{% endblock %}
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/LogoPFJ.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_scripts %}{% endblock %}
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  {% include 'components/header.html' %}
  {% block content %}{% endblock %}
  {% include 'components/footer.html' %}
  <script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
