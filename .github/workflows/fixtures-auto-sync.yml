name: Persibo adaptive fixture sync

on:
  schedule:
    # GitHub Actions polls every 15 minutes. The Vercel endpoint applies
    # adaptive throttling based on the next kickoff stored in Supabase.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persibo-fixture-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected Vercel sync endpoint
        env:
          SYNC_URL: ${{ secrets.VERCEL_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.VERCEL_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "GitHub secrets VERCEL_SYNC_URL and VERCEL_SYNC_TOKEN must be configured."
            exit 1
          fi
          curl --silent --show-error --fail-with-body \
            --max-time 90 \
            --request POST \
            --header "Authorization: Bearer ${SYNC_TOKEN}" \
            --header "Accept: application/json" \
            "$SYNC_URL"
